<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=xx, initial-scale=1.0">
    <title>Document</title>
</head>
<style>

.product-container{
    display:flex;
    gap:20px;
}

.image-box{
    position:relative;
    width:350px;
}

.image-box img{
      width:100%;
    height:400px;
    object-fit:cover;
}

#lens{
    position:absolute;
     top: 0;
    left: 0;
    width:80px;
    height:80px;
    background:rgba(255,255,255,.4);
    border:1px solid #000;
    display:none;
    pointer-events:none;
}

#zoom-result{
    width:400px;
    height:400px;
    border:1px solid #ddd;
    background-repeat:no-repeat;
    display:none;
     background-position:0 0;
    overflow:hidden;
}
</style>
<body>
    <div class="product-container">

    <div class="image-box"> 
        <img  src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=800" id="productImg">
        <div id="lens"></div>
    </div>

    <div id="zoom-result"></div>

</div>
</body>
<script>
const img = document.getElementById("productImg");
const lens = document.getElementById("lens");
const result = document.getElementById("zoom-result");

function showZoom() {
  lens.style.display = "block";
  result.style.display = "block";

  result.style.width = img.offsetWidth + "px";
  result.style.height = img.offsetHeight + "px";

  result.style.backgroundImage = `url(${img.src})`;

  const cx = result.offsetWidth / lens.offsetWidth;
  const cy = result.offsetHeight / lens.offsetHeight;

  result.style.backgroundSize =
    `${img.offsetWidth * cx}px ${img.offsetHeight * cy}px`;
}

function hideZoom() {
  lens.style.display = "none";
  result.style.display = "none";
}

function moveLens(e) {
  const rect = img.getBoundingClientRect();

  const lensW = lens.offsetWidth;
  const lensH = lens.offsetHeight;

  let x = e.clientX - rect.left - lensW / 2;
  let y = e.clientY - rect.top - lensH / 2;

  const maxX = img.offsetWidth - lensW;
  const maxY = img.offsetHeight - lensH;

  x = Math.max(0, Math.min(x, maxX));
  y = Math.max(0, Math.min(y, maxY));

  lens.style.transform = `translate(${x}px, ${y}px)`;

  const cx = result.offsetWidth / lens.offsetWidth;
  const cy = result.offsetHeight / lens.offsetHeight;

  result.style.backgroundPosition =
    `-${x * cx}px -${y * cy}px`;
}

img.addEventListener("mouseenter", showZoom);
img.addEventListener("mouseleave", hideZoom);
img.addEventListener("mousemove", moveLens);
</script>
</html>
